services:
  - type: web
    name: empire-youtube-channel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PEXELS_API_KEY
        sync: false
      - key: AUTO_APPROVE_FOOTAGE
        value: "1"
      - key: GOOGLE_TTS_LANGUAGE
        value: en
      - key: VIDEO_WIDTH
        value: "1280"
      - key: VIDEO_HEIGHT
        value: "720"
      - key: VIDEO_FPS
        value: "24"
      - key: MAX_SOURCE_WIDTH
        value: "720"
      - key: VIDEO_PAN_REGION
        value: top_50
